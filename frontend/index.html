<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B0C" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F5B301'/%3E%3Cpath d='M16 6 6 11v2h20v-2zM8 15v7h3v-7zm6 0v7h4v-7zm7 0v7h3v-7zM6 24v2h20v-2z' fill='%231A1400'/%3E%3C/svg%3E" />
    <title>Finance Tracker</title>
    <script>
      // Apply the saved theme before first paint to avoid a dark/light flash.
      // Keys and colours must match src/theme/themeConstants.js.
      (function () {
        var mode = 'dark';
        try {
          var stored = localStorage.getItem('finance-tracker:theme-mode');
          if (stored === 'light' || stored === 'dark') mode = stored;
        } catch (e) {}
        var bg = mode === 'light' ? '#F6F5F1' : '#0B0B0C';
        var root = document.documentElement;
        root.style.backgroundColor = bg;
        root.style.colorScheme = mode;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
