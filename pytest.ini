[pytest]
pythonpath = backend ai
testpaths = tests
addopts = -ra
markers =
    mock: offline test using fake LLMs / embeddings (default tier for AI phases)
    live_gemini: needs a real GOOGLE_API_KEY (skipped otherwise; never counted as a pass)
    live_langsmith: needs LANGCHAIN_API_KEY (skipped otherwise)
    real_clock: run with the real system date instead of the frozen spec clock
filterwarnings =
    ignore::DeprecationWarning
    ignore::pydantic.warnings.PydanticDeprecatedSince20
    ignore:.*model_fields.*:DeprecationWarning
